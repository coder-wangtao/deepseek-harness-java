# Harness 业务配置：与 application.yml（框架配置）分层，只放业务运行参数。
# 双通道加载：classpath 内置兜底 + 工作目录 ./harness.yml 可覆盖（见 application.yml 的 spring.config.import）。
harness:
  llm:
    deepseek:
      # 环境变量嵌套兜底：LLM_BASE_URL > DEEPSEEK_BASE_URL > 内置默认值
      base-url: ${LLM_BASE_URL:${DEEPSEEK_BASE_URL:http://127.0.0.1:8777/v1}}
      api-key: ${LLM_API_KEY:${DEEPSEEK_API_KEY:}}
      max-tokens: 8192
      context-window: 128000
      default-model: ${LLM_DEFAULT_MODEL:${DEEPSEEK_DEFAULT_MODEL:glm-5.3-flash}}

  # 配置生效标记：用于观察 profile 覆盖优先级（standalone profile 会覆盖它）
  stage-name: dev-default
